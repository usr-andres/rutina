<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Rutina Diaria</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker activo'))
          .catch(err => console.error('Error registrando SW:', err));
      });
    }
  </script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 44, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --current-glow: rgba(59, 130, 246, 0.35);
      --current-border: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1rem 0.75rem 2.5rem;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.25rem;
    }

    .date-badge {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .current-clock {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .progress-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.25rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .progress-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .progress-pct {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .bar-bg {
      background: rgba(255, 255, 255, 0.08);
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      background: linear-gradient(90deg, #10b981, #3b82f6);
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .routine-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .task-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .task-item:active {
      transform: scale(0.985);
    }

    .task-item.is-current {
      border-color: var(--current-border);
      box-shadow: 0 0 20px var(--current-glow);
    }

    .task-item.is-completed {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.05);
    }

    .task-item.is-completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      flex: 1;
    }

    .task-time {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .task-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .custom-check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .task-item.is-completed .custom-check {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .custom-check svg {
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .task-item.is-completed .custom-check svg {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div>
        <div class="date-badge" id="current-date">CARGANDO...</div>
        <div class="current-clock" id="current-time">00:00:00 AM</div>
      </div>
    </header>

    <div class="progress-card">
      <div class="progress-header">
        <span class="progress-title">Progreso del Día</span>
        <span class="progress-pct" id="progress-pct">0%</span>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" id="bar-fill"></div>
      </div>
    </div>

    <div class="routine-list" id="routine-list"></div>
  </div>

  <script>
    const routineData = [
      { id: 't1', start: '05:20', end: '05:45', timeTxt: '05:20 am – 05:45 am', title: 'Despertar y Alistamiento', sub: 'Hidratación y alistamiento rápido' },
      { id: 't2', start: '06:00', end: '14:15', timeTxt: '06:00 am – 02:15 pm', title: 'Turno en Melody Flowers', sub: 'Soporte IT (Almuerzo: 12:20 pm)' },
      { id: 't3', start: '14:15', end: '14:30', timeTxt: '02:15 pm – 02:30 pm', title: 'Regreso a Casa', sub: 'Trayecto de 15 minutos' },
      { id: 't4', start: '14:30', end: '15:00', timeTxt: '02:30 pm – 03:00 pm', title: 'Pre-entreno y Ropa de Gym', sub: 'Snack ligero o recarga' },
      { id: 't5', start: '15:00', end: '16:30', timeTxt: '03:00 pm – 04:30 pm', title: 'Entrenamiento Físico', sub: 'Gym (FST-7 / Hipertrofia) o Running' },
      { id: 't6', start: '16:30', end: '17:30', timeTxt: '04:30 pm – 05:30 pm', title: 'Ducha y Post-entreno', sub: 'Suplementación proteica y merienda sólida' },
      { id: 't7', start: '17:30', end: '19:30', timeTxt: '05:30 pm – 07:30 pm', title: 'Bloque Estudio UNAD', sub: 'Plataforma y tareas pendientes' },
      { id: 't8', start: '19:30', end: '20:45', timeTxt: '07:30 pm – 08:45 pm', title: 'Laboratorio y Proyectos', sub: 'Ciberseguridad, homelab, Docker o Python' },
      { id: 't9', start: '20:45', end: '21:30', timeTxt: '08:45 pm – 09:30 pm', title: 'Cena de Recuperación', sub: 'Cena balanceada' },
      { id: 't10', start: '21:30', end: '22:00', timeTxt: '09:30 pm – 10:00 pm', title: 'Desconexión y Lectura', sub: 'Alistamiento mental y lectura estoica' },
      { id: 't11', start: '22:00', end: '23:59', timeTxt: '10:00 pm', title: 'Dormir', sub: 'Descanso y recuperación muscular' }
    ];

    const todayStr = new Date().toISOString().split('T')[0];
    const storageKey = `rutina_${todayStr}`;
    let state = JSON.parse(localStorage.getItem(storageKey)) || {};

    const listEl = document.getElementById('routine-list');
    const barFill = document.getElementById('bar-fill');
    const progressPct = document.getElementById('progress-pct');

    function render() {
      listEl.innerHTML = '';
      let completed = 0;

      routineData.forEach(item => {
        const isDone = !!state[item.id];
        if (isDone) completed++;

        const card = document.createElement('div');
        card.className = `task-item ${isDone ? 'is-completed' : ''}`;
        card.onclick = () => toggleTask(item.id);

        card.innerHTML = `
          <div class="task-info">
            <div class="task-time">${item.timeTxt}</div>
            <div class="task-title">${item.title}</div>
            <div class="task-sub">${item.sub}</div>
          </div>
          <div class="custom-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        `;
        listEl.appendChild(card);
      });

      const pct = Math.round((completed / routineData.length) * 100);
      barFill.style.width = `${pct}%`;
      progressPct.innerText = `${pct}%`;
    }

    function toggleTask(id) {
      state[id] = !state[id];
      localStorage.setItem(storageKey, JSON.stringify(state));
      render();
    }

    function updateClock() {
      const now = new Date();
      const options = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('current-date').innerText = now.toLocaleDateString('es-ES', options).toUpperCase();

      let hours = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      document.getElementById('current-time').innerText = `${hours}:${mins}:${secs} ${ampm}`;
    }

    setInterval(updateClock, 1000);
    updateClock();
    render();
  </script>
</body>
</html>
